name: CI

on:
  push:
  pull_request:

jobs:
  breathekit:
    name: BreatheKit tests + simulator (Linux)
    runs-on: ubuntu-latest
    container: swift:6.1
    steps:
      - uses: actions/checkout@v4
      - name: Unit tests
        run: swift test --package-path Packages/BreatheKit
      - name: Session simulator
        run: swift run --package-path Packages/BreatheKit breathe-sim all --quiet

  ios:
    name: iOS app tests (Simulator)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      - name: Show toolchain
        run: |
          xcodebuild -version
          xcrun simctl list devices available | grep -i iphone | head -5
      - name: Build and test on iPhone simulator
        run: |
          set -o pipefail
          mkdir -p test-output
          xcodebuild test \
            -project BreatheApp.xcodeproj \
            -scheme BreatheApp \
            -destination 'platform=iOS Simulator,name=iPhone 16' \
            -resultBundlePath test-output/BreatheApp.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            | grep -E 'error:|warning:|Test Suite|Test Case.*(passed|failed)|\*\* TEST'
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcresult
          path: test-output
